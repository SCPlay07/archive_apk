<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Descargas Directas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 20px 10px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 440px; background: #1e293b; padding: 20px 15px; border-radius: 12px; text-align: center; }
    
    /* Filas de Apps */
    .app-row { display: flex; align-items: center; justify-content: space-between; background: #334155; padding: 14px 16px; margin: 10px 0; border-radius: 8px; }
    .app-name { font-size: 16px; font-weight: 600; color: #ffffff; }
    .btn-download { background: #22c55e; color: #ffffff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; display: inline-block; }
    .btn-download:active { background: #16a34a; }

    /* Espacios Fijos para Anuncios */
    .ad-slot { margin: 15px 0; min-height: 60px; display: flex; justify-content: center; align-items: center; background: #0f172a; border: 1px dashed #475569; border-radius: 6px; overflow: hidden; }
  </style>
</head>
<body>

<div class="container">

  <!-- BANNER ANUNCIO TOP -->
  <div class="ad-slot" id="ad-top">
    <!-- Pega aquí el código del Banner 1 de Adsterra -->
  </div>

  <!-- App 1 (Xuper APK) -->
  <div class="app-row">
    <span class="app-name">Xuper APK</span>
    <a href="app1.apk" class="btn-download" download>Descargar</a>
  </div>

  <!-- App 2 -->
  <div class="app-row">
    <span class="app-name">App 2</span>
    <a href="app2.apk" class="btn-download" download>Descargar</a>
  </div>

  <!-- App 3 -->
  <div class="app-row">
    <span class="app-name">App 3</span>
    <a href="app3.apk" class="btn-download" download>Descargar</a>
  </div>

  <!-- BANNER ANUNCIO MEDIO -->
  <div class="ad-slot" id="ad-middle">
    <!-- Pega aquí el código del Banner 2 de Adsterra -->
  </div>

  <!-- App 4 -->
  <div class="app-row">
    <span class="app-name">App 4</span>
    <a href="app4.apk" class="btn-download" download>Descargar</a>
  </div>

  <!-- App 5 -->
  <div class="app-row">
    <span class="app-name">App 5</span>
    <a href="app5.apk" class="btn-download" download>Descargar</a>
  </div>

</div>

</body>
</html>
